# docs/harness-design.md §7.1 — runtime/model 교체는 여기만 바꾼다.
# runtime: ollama | llama_cpp | openai | mock
runtime: ollama
model: local-jarvis-qwen3:8b
# api_format: native_chat(ollama /api/chat, 참조 앱 사용) | openai_compat(/v1)
api_format: native_chat
base_url: http://127.0.0.1:11434
profile: desktop
timeout_s: 180

# Slice 2 — chat_with_tools tool-call 루프 최대 모델 호출 횟수 (§8.3-3)
tool_loop_max_turns: 4

generation:
  temperature: 0.6
  num_predict: 240

trace:
  enabled: true
  dir: data/traces

# §8 Slice 1·4 — tool 데이터 원천 (참조 앱 local-jarvis memory/).
# 이 머신 전용 절대 경로 — HARNESS_MEMORY_DIR 환경변수로 재정의 가능.
# get_project_context: memory/*.md 조회 (read)
# create_task: 기본 저장 위치는 <memory_dir>/tasks.md (write, §8.3-2 confirm 필수).
#   task_file은 반드시 memory_dir 안이어야 함(§8.4) — HARNESS_TASK_FILE로 재정의 가능.
tools:
  memory_dir: C:/Users/USER/Desktop/AI_WORKSPACE/projects/local-jarvis/memory
